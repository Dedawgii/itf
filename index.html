<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>FOODPICKER ITF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f9f9f9;
        }
        .navbar {
            width: 100%;
            background-color: lightgray;
            padding: 15px 0;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
        .box {
            border: 1px solid black;
            padding: 20px;
            width: 300px;
            margin-top: 40px;
            background-color: white;
            text-align: center;
            border-radius: 8px;
        }
        img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
        }
        button {
            margin-top: 15px;
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="navbar">
        FOODPICKER ITF
    </div>

    <div class="box">
        <img id="food-img" src="" alt="รูปอาหาร">
        <h2 id="food-name">ชื่อเมนู</h2>
        <p id="food-desc">รายละเอียด</p>
        <p id="food-price">ราคา</p>
        <button onclick="randomFood()">สุ่มเมนู</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
